spring.application.name=exam-integrity
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/examdb
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.uiu.examintegrity=DEBUG

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=2h

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Code execution. The local executor shells out to a toolchain in a throwaway directory per
# run; these limits are the only thing bounding what a submitted program can cost the
# server, so do not raise them casually. See LocalProcessExecutor for what they do and do
# not protect against.
#
# A language whose compiler is missing here is reported unavailable and shown disabled in the
# selector rather than failing at the first Run. Not python3: on Windows that name is a Store
# alias, not an interpreter.
app.code.gcc-path=gcc
app.code.gpp-path=g++
app.code.python-path=python
app.code.c-standard=c11
# c++14 rather than c++17 because the MinGW on the development machine is GCC 6, which rejects
# the newer flag outright. Nothing an intro exam asks for needs c++17; raise it with the
# toolchain.
app.code.cpp-standard=c++14
app.code.compile-timeout-ms=10000
app.code.run-timeout-ms=2000
app.code.max-output-bytes=65536
app.code.max-source-chars=20000
app.code.max-concurrent-runs=2
app.code.queue-timeout-ms=15000

# The interactive console. These carry more weight than the batch limits above: a graded run is
# bounded by its two-second timeout, while a console keeps a program alive for minutes.
app.code.console.idle-timeout-ms=60000
app.code.console.max-total-ms=300000
app.code.console.max-output-bytes=262144
app.code.console.max-concurrent=8
app.code.console.max-input-chars=4000
app.code.console.sweep-interval-ms=10000
app.code.console.subscriber-wait-ms=3000
